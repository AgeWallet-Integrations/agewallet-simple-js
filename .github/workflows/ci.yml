name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer run on the same branch, tag or pull request cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    # Runs on the organisation repo only, never on personal forks.
    if: github.repository == 'AgeWallet-Integrations/agewallet-simple-js'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Every test runs against aw-loader.unminified.js and aw-loader.min.js
      - name: Test
        run: npx vitest run
